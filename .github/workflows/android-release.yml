name: Android release

# Builds a Play-ready signed AAB (+ APK for sideload testing) and, on a manual
# dispatch, uploads it to Google Play.
# Signing: the upload keystore lives ONLY in GitHub secrets
# (ANDROID_KEYSTORE_BASE64 / _PASSWORD, ANDROID_KEY_ALIAS / _PASSWORD);
# Gradle picks it up via env vars — see Android/build.gradle.kts.
# Play upload: the service-account key lives ONLY in the PLAY_SERVICE_ACCOUNT_JSON
# secret. Release notes come from Native Mobile/Android/whatsnew/whatsnew-en-US
# (≤500 chars) — update it for every release. Default is a DRAFT on the chosen
# track: a person still sends it for review in Play Console (Publishing overview).

on:
  workflow_dispatch:
    inputs:
      versionCode:
        description: "Override versionCode (blank = value in build.gradle.kts)"
        required: false
      versionName:
        description: "Override versionName (blank = value in build.gradle.kts)"
        required: false
      playTrack:
        description: "Upload the AAB to this Google Play track (none = build only)"
        type: choice
        options: [production, internal, none]
        default: production
      playStatus:
        description: "Play release status: draft (send for review by hand) or completed (goes to review now)"
        type: choice
        options: [draft, completed]
        default: draft
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    name: Episode engine regression suite
    # macos-26: the Cast SDK static lib auto-links frameworks that only exist
    # in the iOS 26 SDK, so linking the test binary needs Xcode 26+.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Select newest installed Xcode
        run: |
          ls -d /Applications/Xcode*.app
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version
      - name: Fetch Google Cast SDK (cinterop dependency, gitignored)
        working-directory: Native Mobile
        run: ./scripts/fetch_cast_sdk.sh
      - name: Run shared tests (iosSimulatorArm64Test)
        working-directory: Native Mobile
        run: ./gradlew :shared:iosSimulatorArm64Test

  android:
    name: Signed AAB + APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode upload keystore
        run: printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      - name: Build signed release
        working-directory: Native Mobile
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ inputs.versionCode }}
          VERSION_NAME: ${{ inputs.versionName }}
        run: |
          EXTRA=""
          [ -n "$VERSION_CODE" ] && EXTRA="$EXTRA -PversionCode=$VERSION_CODE"
          [ -n "$VERSION_NAME" ] && EXTRA="$EXTRA -PversionName=$VERSION_NAME"
          ./gradlew :androidApp:bundleRelease :androidApp:assembleRelease $EXTRA
      - name: Shred keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload-keystore.jks"
      - name: Check for Play credentials
        id: play
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_TRACK: ${{ inputs.playTrack }}
        run: |
          if [ -z "$PLAY_TRACK" ] || [ "$PLAY_TRACK" = "none" ]; then
            echo "upload=false" >> "$GITHUB_OUTPUT"; echo "No Play upload requested (tag push or track=none)."
          elif [ -z "$PLAY_JSON" ]; then
            echo "upload=false" >> "$GITHUB_OUTPUT"; echo "::warning::PLAY_SERVICE_ACCOUNT_JSON is not set; skipping the Play upload."
          else
            echo "upload=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload to Google Play
        if: steps.play.outputs.upload == 'true'
        # r0adkll/upload-google-play v1.1.5, pinned by commit.
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.nomnomsom.armstrongandgetty
          releaseFiles: Native Mobile/Android/build/outputs/bundle/release/*.aab
          track: ${{ inputs.playTrack }}
          status: ${{ inputs.playStatus }}
          whatsNewDirectory: Native Mobile/Android/whatsnew
          mappingFile: Native Mobile/Android/build/outputs/mapping/release/mapping.txt
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          if-no-files-found: error
          path: |
            Native Mobile/Android/build/outputs/bundle/release/*.aab
            Native Mobile/Android/build/outputs/apk/release/*.apk
