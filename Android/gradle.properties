# Allocate 8GB heap for Gradle daemon
org.gradle.jvmargs=-Xmx8g -XX:+UseG1GC -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

# Use all available cores for parallel execution
org.gradle.parallel=true

# Keep daemon alive for faster subsequent builds
org.gradle.daemon=true

# Build caching for faster rebuilds
org.gradle.caching=true

# Configure on demand - only configure needed projects
org.gradle.configureondemand=true

# AndroidX
android.useAndroidX=true

# Kotlin
kotlin.code.style=official

# Non-transitive R classes (smaller APK, faster builds)
android.nonTransitiveRClass=true

# Disable KSP incremental processing to avoid "Storage is already registered" error
ksp.incremental=false
